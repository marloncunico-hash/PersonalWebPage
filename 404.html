<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Página não encontrada — Marlon Cunico</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/assets/img/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="/assets/css/style.css">
<style>
  .nf{min-height:100vh;display:flex;align-items:center;background:var(--navy);color:var(--on-dark)}
  .nf h1{font-size:clamp(30px,5vw,46px);color:#fff;line-height:1.1}
  .nf p{margin-top:14px;color:var(--on-dark-mute);max-width:46ch}
  .nf .code{font-size:12.5px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--teal-bright);margin-bottom:16px}
  .nf .actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:28px}
</style>
</head>
<body>
<section class="nf">
  <div class="wrap">
    <p class="code">Erro 404</p>
    <h1>Esta página não existe</h1>
    <p>O endereço mudou ou o link está incorreto. A página inicial tem tudo: resultados, trajetória, formação e contato. <span lang="en">This page does not exist — the home page has everything.</span></p>
    <div class="actions">
      <a class="btn btn--primary" href="/">Ir para o início</a>
      <a class="btn btn--ghost" href="/en/" hreflang="en" lang="en">English version</a>
    </div>
  </div>
</section>
</body>
</html>
